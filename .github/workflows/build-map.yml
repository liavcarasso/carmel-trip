name: build-map
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/**"
      - ".github/workflows/build-map.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy scipy rasterio matplotlib shapely pillow
      - run: python tools/gen_map.py
      - name: Commit map data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Build offline hiking map data"
          git push
